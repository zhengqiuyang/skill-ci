# skill-ci: lint every SKILL.md inside this repository with skill-lint.
#
# Why continue-on-error (non-blocking by design):
# The in-repo SKILL.md files are the linter's own test fixtures
# (tests/fixtures/**) and several of them intentionally contain malformed
# skills (no-frontmatter, missing-keys, nested-metadata-bad, long-desc, ...)
# so the scan is *expected* to exit 1 with error findings. Gating PRs on
# that would fail every push for content that exists precisely to exercise
# the rules. The run stays visible in the Actions tab; a future W4 gate
# should lint only real skills, not the fixture tree.
#
# No pip install: skill-lint is stdlib-only and runs straight from the
# checkout via `PYTHONPATH=src python -m skill_ci`.
#
# Local validation note: this file was self-checked locally with a
# hand-rolled structural YAML-subset checker only (no PyYAML on the author
# machine; see .scratch/w3-tools/check_workflow.py in the dev sandbox).
# 完整验证在首次 push 后进行 — full schema/action validation happens on the
# first push, when GitHub parses the workflow for real.

name: skill-ci

on:
  push:
  pull_request:

jobs:
  skill-lint:
    name: skill-lint (${{ matrix.os }})
    strategy:
      # one OS failing must not cancel the other leg
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: skill-lint over in-repo SKILL.md (tests/fixtures tree)
        # non-blocking: fixtures intentionally trigger error findings (see
        # header comment); the step is still reported for humans to read
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m skill_ci . --format markdown
