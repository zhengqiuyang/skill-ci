# skill-ci: lint every SKILL.md in this repository.
#
# Two jobs:
# - example-gate: BLOCKING. Lints examples/skills, a small valid skill set.
#   This is the "CI can actually gate" demonstration; a real error fails the
#   job.
# - fixture-smoke: NON-BLOCKING. Lints the repo's own tests/fixtures tree,
#   which intentionally contains malformed skills; it is a smoke test, not a
#   gate. Gating on it would fail every push for content that exists to
#   exercise the rules.
#
# Reusable: `workflow_call` accepts a `target` input, so another repository
# can call this workflow and lint its own skills with a blocking gate.
#
# Local validation note: the YAML was self-checked with a hand-rolled
# structural subset checker only (no PyYAML on the author machine). Full
# schema/action validation happens on the first push, when GitHub parses it.
name: skill-ci

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      target:
        description: Path to lint
        required: false
        type: string
        default: examples/skills

jobs:
  example-gate:
    name: example gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: skill-lint (blocking)
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m skill_ci "${{ inputs.target || 'examples/skills' }}" --format markdown

  fixture-smoke:
    if: ${{ github.event_name != 'workflow_call' }}
    name: fixture smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: skill-lint fixtures (non-blocking, expected errors)
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: src
        run: python -m skill_ci . --format markdown
