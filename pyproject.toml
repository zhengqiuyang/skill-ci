[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-ci"
version = "0.1.0"
description = "Static CI for agent skills: lint SKILL.md, test trigger selection, and gate PRs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["skills", "lint", "ci", "skill-md", "claude", "agents"]
license = { text = "MIT" }
authors = [{ name = "skill-ci contributors" }]

[project.urls]
Homepage = "https://github.com/zhengqiuyang/skill-ci"
Repository = "https://github.com/zhengqiuyang/skill-ci"

[project.scripts]
skill-lint = "skill_ci.cli:main"
skill-test = "skill_ci.cli:test_main"

[tool.setuptools.packages.find]
where = ["src"]
